id: drums
name: Dusty Kit
instrument: drum_kit
sound:
  source: sample_pack
  samplePack: /samples/virtuosity-kit/manifest.yaml
gain: 0.92
saturation: 0.32
lowpass: 7400
highpass: 55
groove: dilla-drag
humanize: 0.012
kit:
  kick:  { soundfont: taiko_drum, pitch: A1, gain: 1.05 }
  snare: { soundfont: synth_drum, pitch: D3, gain: 0.9 }
  hat:   { soundfont: woodblock,  pitch: C5, gain: 0.5, pan: 0.15 }
  open_hat: { soundfont: woodblock, pitch: G5, gain: 0.45, pan: 0.18 }
  perc:  { soundfont: synth_drum, pitch: A4, gain: 0.55, pan: -0.15 }
pattern:
  resolution: 16
  bars: 2
  repeat: 18 # 36 bars total
  start: 1:1
  swing: 0.18
  velocity: { default: 0.78, ghost: 0.34, accent: 0.95 }
  lanes:
    kick:  "x . . . . . . . . . x . . . . . x . . . . . . . x . . . . . . ."
    snare: ". . . . X . . g . . . . x . . . . . . . X . . . . . g . . . . ."
    hat:   "X . x . x . g . X . x . x . x . X . x . x . g . X . x . x . x ."
    perc:  ". . . . . . . . . . . . . g . . . . . . . . . g . . . . . . . ."
notes:
  # Intro fill
  - { time: 4:4, duration: 8n, pitch: snare, velocity: 0.75 }
  - { time: 4:4:2, duration: 8n, pitch: snare, velocity: 0.55 }
  # Transition to Breakdown (Solar Shift)
  - { time: 12:4:3, duration: 8n, pitch: open_hat, velocity: 0.75 }
  # Transition to Verse 2
  - { time: 20:4, duration: 8n, pitch: snare, velocity: 0.85 }
  - { time: 20:4:2, duration: 8n, pitch: snare, velocity: 0.65 }
  - { time: 20:4:3, duration: 8n, pitch: open_hat, velocity: 0.70 }
  # Transition to Outro
  - { time: 28:4, duration: 4n, pitch: snare, velocity: 0.92, articulation: marcato }
